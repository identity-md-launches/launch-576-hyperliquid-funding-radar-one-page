<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1114" />
    <meta name="description" content="A live, read-only radar for Hyperliquid perpetual funding, open interest, and market extremes." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>hl-radar — Hyperliquid Funding Radar</title>
    <script>
      try {
        const preference = localStorage.getItem('hl-radar-theme') || 'system';
        document.documentElement.dataset.theme = preference === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : preference;
      } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
